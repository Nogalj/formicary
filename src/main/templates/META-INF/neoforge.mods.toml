# The `generateModMetadata` Gradle task expands the dollar-brace placeholders below from
# gradle.properties into build/generated/sources/modMetadata/META-INF/neoforge.mods.toml,
# and THAT is what lands in the jar. To change the mod's identity or version, edit
# gradle.properties -- never hardcode a value here.
#
# CAREFUL: this file is run through Groovy's SimpleTemplateEngine, not copied. Every
