# No access transformers either.
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # Minimum the current Minecraft version, up to but not including the next major.
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
