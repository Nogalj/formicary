# For a regular FML @Mod mod this is always javafml.
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

# MIT -- see LICENSE at the repo root.
license="${mod_license}"

# Where bug reports should go. NeoForge surfaces this in the mod list and in crash reports,
# which is the moment a player is most likely to want it.
issueTrackerURL="https://github.com/Nogalj/formicary/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

# Shown in the mod list.
displayURL="https://github.com/Nogalj/formicary"

# Relative to the ROOT of the mod jar, not to assets/. Generated by
# assets-src/mod_icon.py alongside every other texture in this mod.
logoFile="formicary.png"

authors="Nogal"

credits="Built in public with Claude Code. Programmer art throughout -- every texture, mob model and mob voice in this mod is generated by a script under assets-src/."

# Shown in the mod list. Multi-line.
description='''
An ant colony is not a dungeon you clear. It is a place you learn to live alongside.

Throw an ender pearl at a savanna anthill and you fall into the Formicary: a layered
underground dimension of packed soil, amber and glowing fungal gardens, worked by four
castes of ant and ruled by a queen who does not tolerate visitors.

Steal a larva and raise it yourself, and it imprints on you. Tamed workers harvest your
crops and carry them to a chest you bind them to. Tamed soldiers fight beside you. The
colony remembers being robbed, so taking what you want has a price -- and the deeper
chambers do not wait to be provoked.

Ends at a queen who fights in three phases and drops the two things worth taking:
the Royal Pheromone Gland, which calls her own soldiers to your side, and the Queen's
Crest, which arms the only two tools in the mod above netherite.
'''

